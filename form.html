<!DOCTYPE html>
<html>
<head>
    <title>Personal Information </title>
</head>

<body>
    <h1>Personal Information</h1>
    <form>
        <label for="name">
            Full Name:
        </label>
        <input
            type="text"
            id="name"
            name="fullName"
            placeholder="Enter your full name"
            minlength="3"
            maxlength="50"
            required
        >
        <br>
        <label for="studentcode">
            Student Code:
        </label>
        <input
            type="text"
            id="studentcode"
            name="studentCode"
            placeholder="Enter your student code"
            pattern="^[A-Za-z0-9]+"
            required
        >        
        <br>
        <label for="email">
            Email:
        </label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >
        <br>
        <label for="telephone">
            Telephone:
        </label>
        <input
            type="text"
            id="telephone"
            name="telephone"
            pattern="[0-9]"
            required
        >
        <br>
                <label for="date">
            Date of Birth:
        </label>
        <input
            type="date"
            id="date"
            name="date"
            placeholder="Enter your date of birth"
        >
        <br>
        <label for="age">
            Age:
        </label>
        <input
            type="number"
            id="age"
            name="age"
            min="18"
            max="30"
        >
        <p>Gender:</p>
        <input
        type="radio"
        id="male"
        name="gender"
        value="male"
        >       
        <label for="male">
            Male
        </label>
        <br>
        <input
            type="radio"
            id="female"
            name="gender"
            value="female"
        >
        <label for="female">
            Female
        </label>
        <br>
        <label for="major">
            Major:
        </label>

        <select
            id="major"
            name="major"
        >

        <option value="">
        -- Select a major --
        </option>

        <option value="it">
        Information Technology
        </option>

        <option value="ai">
        Artificial Intelligence
        </option>

        <option value="business">
        Business Administration
        </option>

        </select>
        <br>
        <label for="year">
            Year of Study:
        </label>
        <select
            id="year"
            name="major"
        >
        <option value="">
        -- Select a year of study --
        </option>
        <option value="1st year">   
        1st Year
        </option>
        <option value="2nd year">
        2nd Year
        </option>
        <option value="3rd year">
        3rd Year
        </option>
        <option value="4th year">
        4th Year
        </option>
        </select>
        <p>Hobbies:</p>
        <input 
            type="checkbox"
            id="sports"
            name="hobby"
            value="sports"
        >
        <label for="sports">
            Sports
        </label>
        <br>
        <input 
            type="checkbox"
            id="music"
            name="hobby"
            value="music"
        >
        <label for="music">
            Music   
        </label>
        <br>
        <input 
            type="checkbox"
            id="reading"
            name="hobby"
            value="reading"
        >   
        <label for="reading">
            Reading 
        </label>
        <br>  
        <p>Programming Languages:</p>
        <input 
            type="checkbox"
            id="python"
            name="programming"
            value="python"
        >
        <label for="python">
            Python
        </label>
        <br>
        <input 
            type="checkbox"
            id="javascript"
            name="programming"
            value="javascript"
        >
        <label for="javascript">
            JavaScript
        </label>
        <br>
        <input 
            type="checkbox"
            id="java"
            name="programming"
            value="java"
        >
        <label for="java">
            Java
        </label>
        <br>
        <label for="photo">
            Profile Picture:
        </label>

        <input
            type="file"
            id="photo"
            name="photo"
            accept="image/*"
        >
        <br>
        <label for="studentId">
            Student ID:
        </label>

        <input
            type="text"
            id="studentId"
            name="studentId"
            value="SV001"
            readonly
        >
        <br>
        <label for="country">
            Country:
        </label>

        <input
            type="text"
            id="country"
            name="country"
            value="Vietnam"
            disabled
        >
        <br>
        <label for="address">
            Address:
        </label>
        <br>
        <textarea
            id="address"
            name="address"
        >
        </textarea>
        <br>
        <label for="introduction">
            Introduction:   
        </label>
        <br>
        <textarea
        id="introduction"
        name="introduction"
        maxlength="200"
        placeholder="Enter your introduction"
        >
        </textarea>
        <br>
        <label for="passwords">
            Password:
        </label>
        <input
            type="password"
            id="passwords"
            name="passwords"
            required
        >
        <br>
        <button>
	        Press this to submit form
        </button>
        <br>
        <button type="reset">
            Reset Form
        </button>
    </form>
</body>

</html>
